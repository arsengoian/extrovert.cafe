# Збірка образів і викочування на дроплет.
#
# Той самий файл виконується локально через act (`make act-build`,
# `make act-deploy`) — тому тут немає нічого, що працює лише на раннері
# GitHub: жодних кроків з оточенням раннера, а замість `GITHUB_TOKEN`
# береться `GHCR_TOKEN`, коли він є. Під act (`env.ACT` виставляє сам act)
# шлях той самий, що й у CI: збірка логіниться в ghcr токеном із .secrets і
# пушить образи, деплой їх викочує (рішення власника 22.09.2026 — інакше
# локальний прогін нічого не міг би викотити). Відрізняються лише кеш
# збірки (GitHub Actions cache локально недоступний), реліз кіоска й
# прибирання реєстру — вони під act не виконуються.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: arsengoian

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Один образ, що впав, не має скасовувати решту: зручніше побачити
      # відразу всі поламані, ніж вертатись по одному.
      fail-fast: false
      matrix:
        include:
          - { svc: api,       context: ".",            file: "docker/bun.Dockerfile" }
          - { svc: ws,        context: ".",            file: "docker/bun.Dockerfile" }
          - { svc: checkbox,  context: ".",            file: "docker/bun.Dockerfile" }
          - { svc: scheduler, context: ".",            file: "docker/bun.Dockerfile" }
          - { svc: overseer,  context: ".",            file: "docker/bun.Dockerfile" }
          - { svc: migrate,   context: "./db",         file: "db/Dockerfile" }
          - { svc: caddy,     context: "./docker/caddy", file: "docker/caddy/Dockerfile" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # З GHCR_TOKEN (особистий токен власника) логін — від імені власника:
      # під act github.actor — це «nektos/act», а не людина.
      - name: Вхід у ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_TOKEN && env.OWNER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Хеш саме тих тек, з яких збирається цей образ. Комміт зачіпає один
      # сервіс, а перезбирати всі сім — це і хвилини CI, і мегабайти в
      # реєстрі, де в безкоштовному тарифі 500 МБ на все (docs/deploy.md §2.3).
      - name: Хеш джерел
        id: src
        run: |
          case "${{ matrix.svc }}" in
            migrate) paths="db";;
            caddy)   paths="docker/caddy";;
            # Сервіс залежить ще й від спільної бібліотеки, Dockerfile-а та
            # lock-файла: зміна будь-чого з них міняє образ.
            *)       paths="backend/${{ matrix.svc }} backend/lib docker/bun.Dockerfile package.json bun.lock";;
          esac
          hash=$(for p in $paths; do git rev-parse "HEAD:$p"; done | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "джерела $paths → src-$hash"

      - name: Чи такий образ уже є
        id: have
        run: |
          image=${{ env.REGISTRY }}/${{ env.OWNER }}/extrovert-${{ matrix.svc }}
          if docker manifest inspect "$image:src-${{ steps.src.outputs.hash }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "образ із таким хешем уже в реєстрі — збірка не потрібна"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      # Нічого не змінилось: замість збірки й заливки просто вішаємо на вже
      # залитий образ теги цього комміта. imagetools робить це на боці
      # реєстру — шари нікуди не їдуть.
      - name: Перетегувати наявний образ
        if: ${{ steps.have.outputs.exists == '1' }}
        run: |
          image=${{ env.REGISTRY }}/${{ env.OWNER }}/extrovert-${{ matrix.svc }}
          docker buildx imagetools create \
            -t "$image:${{ github.sha }}" -t "$image:latest" \
            "$image:src-${{ steps.src.outputs.hash }}"

      - name: Зібрати ${{ matrix.svc }}
        if: ${{ steps.have.outputs.exists != '1' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: SVC=${{ matrix.svc }}
          # Тег — саме sha комміта: «latest» не дає відповісти на питання
          # «що зараз крутиться» і робить відкат неможливим. Тег src-<хеш>
          # поруч — щоб наступний прогін побачив, що збирати нема чого.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/extrovert-${{ matrix.svc }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/extrovert-${{ matrix.svc }}:src-${{ steps.src.outputs.hash }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/extrovert-${{ matrix.svc }}:latest
          push: true
          cache-from: ${{ env.ACT == 'true' && '' || format('type=gha,scope={0}', matrix.svc) }}
          cache-to: ${{ env.ACT == 'true' && '' || format('type=gha,mode=max,scope={0}', matrix.svc) }}

  # Реліз кіоска. Окремо від образів: він їде не на дроплет, а в публічний
  # бакет, звідки його щочверть години перевіряє апдейтер на точці
  # (docs/raspberry-pi.md §3). Збірка під armv6 через QEMU повільна, тому
  # запускається лише тоді, коли код кіоска справді змінився.
  kiosk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Хеш джерел кіоска
        id: src
        run: |
          hash=$(git rev-parse HEAD:raspberry/kiosk HEAD:raspberry/pi/stack | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Джерело правди про те, що вже викочено, — сам маніфест у бакеті, а
      # не пам'ять CI: точка бере реліз звідти, і звіряти треба з тим, що
      # бачить вона.
      - name: Що зараз у бакеті
        id: published
        run: |
          url=${{ vars.RELEASES_URL || 'https://pos.extrovert.cafe/releases/pi' }}/manifest.json
          source=$(curl -fsS --max-time 20 "$url" | sed -n 's/.*"source"[^"]*"\([^"]*\)".*/\1/p' || true)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$source" = "${{ steps.src.outputs.hash }}" ]; then
            echo "релізу не потрібно: у бакеті вже src-$source"
          else
            echo "у бакеті «${source:-нічого}», у комміті ${{ steps.src.outputs.hash }} — збираємо"
          fi

      - name: QEMU для armv6
        if: ${{ steps.published.outputs.source != steps.src.outputs.hash }}
        uses: docker/setup-qemu-action@v3

      - name: Зібрати ARM-бінарник
        if: ${{ steps.published.outputs.source != steps.src.outputs.hash }}
        run: |
          # Той самий Raspbian Stretch, що на пристрої: бінарник, злінкований
          # із новішою glibc, на точці просто не запуститься.
          docker build --platform linux/arm/v6 -t kiosk-builder \
            -f raspberry/kiosk/docker/pi.Dockerfile raspberry/kiosk
          # Джерела віддаємо копією, а не bind-mount. Під act крок виконується
          # у контейнері раннера, а докер-демон — на хості: шляху воркспейсу
          # він не бачить, мовчки монтує порожню теку, і make каже «no rule to
          # make target 'pi'». На GitHub bind-mount працював, але тримати два
          # різні шляхи заради цього нема сенсу.
          cid=$(docker create --platform linux/arm/v6 -w /work kiosk-builder make pi)
          docker cp raspberry/kiosk/. "$cid:/work"
          docker start -a "$cid"
          mkdir -p raspberry/kiosk/bin   # bin/ під .gitignore, у воркспейсі його немає
          docker cp "$cid:/work/bin/kiosk" raspberry/kiosk/bin/kiosk
          docker rm "$cid"
          file raspberry/kiosk/bin/kiosk | grep -q ARM

      - name: Зібрати архів релізу
        if: ${{ steps.published.outputs.source != steps.src.outputs.hash }}
        env:
          SOURCE_HASH: ${{ steps.src.outputs.hash }}
        # Через sh, а не ./: у git біт виконання є, але act монтує робочу
        # теку з Windows, де його не буває, і крок падав із exit 126.
        run: sh raspberry/pi/stack/make-release.sh

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.published.outputs.source != steps.src.outputs.hash }}
        with:
          bun-version: 1.4.2

      - name: Залити реліз у R2
        if: ${{ steps.published.outputs.source != steps.src.outputs.hash }}
        env:
          # Бакет релізів — прод: APP_ENV нижче вимикає підстановку суфікса
          # -dev у lib/r2.js. Ключі лише тут, у CI: на точку вони не
          # потрапляють ніколи, а бакет для неї публічний на читання.
          APP_ENV: production
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun scripts/push-release.mjs

      # Сказати точкам, що є нова версія, замість чекати, поки котрась сама
      # спитає маніфест. Достукатись до малини ззовні не можна — вона за
      # роутером у локальній мережі, — але вона сама тримає ws до прода, а
      # ws роздає те, що прийшло в Redis. Тож достатньо одного publish на
      # дроплеті: кіоск торкнеться state/check-now, і апдейтер вийде з
      # очікування за пʼять секунд (docs/raspberry-pi.md §6-біс).
      #
      # Крок навмисно НЕ валить збірку: реліз уже лежить у бакеті, і якщо
      # оповістити не вийшло, точки підхоплять його опитуванням за дві
      # хвилини. Це сповіщення, а не доставка.
      - name: Сказати точкам, що є реліз
        if: ${{ steps.published.outputs.source != steps.src.outputs.hash }}
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT || '2222' }}
          USER_: ${{ secrets.SERVER_USER || 'root' }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_notify
          chmod 600 ~/.ssh/id_notify
          # Команда в одинарних лапках: $(docker ps …) має виконатись НА
          # дроплеті, а не на раннері, де докера з нашим redis немає.
          ssh -i ~/.ssh/id_notify -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER_@$HOST" \
            'docker exec $(docker ps --format "{{.Names}}" | grep -m1 redis) redis-cli publish points "{\"event\":\"pi_release\"}"' \
            || echo "не достукались до дроплета — точки підхоплять реліз опитуванням"

  # Лінтер. Тримає рівно те, що збірка не ловить: звернення до неоголошених
  # імен (у тому числі JSX-тегів — це окреме правило react/jsx-no-undef) і
  # мертві змінні. Обидва випадки 23.09.2026 доїхали до прода.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # База знань чату у vector store OpenAI (docs/chat.md §2). Тексти живуть у
  # репозиторії, і сховище має з ними збігатись; kb:push звіряє хеші й
  # заливає лише змінене, тож прогін без змін у базі — один запит-список.
  # Через bun, а не make: скрипт не має залежностей, крім самого bun, тож і
  # bun install не потрібен.
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Перевірка не потребує ні ключа, ні мережі.
      - name: Перевірити базу знань
        run: bun run kb:check

      # Під act теж: сховище має збігатись із тим, що в робочій копії, і
      # ключі для цього act бере з .secrets (make act-secrets, з .env.prod).
      - name: Синхронізувати з OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VECTOR_STORE: ${{ secrets.OPENAI_VECTOR_STORE }}
        run: |
          # Як і з GHCR_TOKEN: secrets в умові кроку недоступні, тож
          # перевіряємо тут.
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$OPENAI_VECTOR_STORE" ]; then
            echo "OPENAI_API_KEY чи OPENAI_VECTOR_STORE не заданий — сховище не чіпаємо"
            exit 0
          fi
          bun run kb:push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ключ до сервера
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Оновити compose на сервері
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT || '2222' }}
          USER_: ${{ secrets.SERVER_USER || 'root' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER_@$HOST" 'mkdir -p /opt/extrovert'
          # Compose-файл — єдине, що їде на сервер із репозиторію: це опис
          # оточення, а не код. Симлінк, щоб на місці працювало просто
          # `docker compose ps` без -f.
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml "$USER_@$HOST:/opt/extrovert/docker-compose.prod.yml"
          $SSH "$USER_@$HOST" 'ln -sfn /opt/extrovert/docker-compose.prod.yml /opt/extrovert/docker-compose.yml'

      - name: Дати серверу доступ до реєстру
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT || '2222' }}
          USER_: ${{ secrets.SERVER_USER || 'root' }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ secrets.GHCR_TOKEN && env.OWNER || github.actor }}
        run: |
          # Перевірка всередині кроку, а не в `if`: контекст secrets в умовах
          # кроку недоступний — умова просто ніколи б не справдилась.
          if [ -z "$GHCR_TOKEN" ]; then
            echo "GHCR_TOKEN не заданий — вважаємо, що сервер уже залогінений"
            exit 0
          fi
          # Образи приватні: у них наш код, тому публічними вони не будуть.
          # Логін лишається в /root/.docker/config.json, щоб і ручний
          # `docker compose pull` на сервері працював.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new "$USER_@$HOST" \
            "docker login ghcr.io -u $ACTOR --password-stdin"

      - name: Викотити
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT || '2222' }}
          USER_: ${{ secrets.SERVER_USER || 'root' }}
        run: |
          # Скрипт їде через stdin і на сервері не лишається: на дроплеті має
          # бути docker-compose.yml, .env і томи — більше нічого.
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$USER_@$HOST" 'bash -s' -- "${{ github.sha }}" < docker/rollout.sh

  # Фронтенди — чотири воркери на Cloudflare: застосунок гравця, адмінка,
  # переадресація з QR-наклейки й короткі посилання. Раніше їх котили руками
  # (make deploy-client / deploy-admin / …), і 23.09.2026 це вкотре
  # закінчилось тим, що бекенд у проді новий, а адмінка — стара.
  #
  # Котимо лише змінені: wrangler на кожен deploy створює нову версію
  # воркера, тож без перевірки кожен коміт у бекенд плодив би їх у всіх
  # чотирьох. Що саме викочено, питаємо в самого Cloudflare — версія несе
  # тег src-<хеш джерел>, так само як образ у реєстрі.
  #
  # Після deploy навмисно: фронтенд часто їде по нові роути api, і якщо
  # бекенд не викотився, старий фронтенд кращий за новий зі скаргами.
  frontends:
    needs: [lint, deploy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, qr, redirect]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Викотити ${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # У списку версій воркера буде видно, з якого коміту зібрано.
          DEPLOY_MESSAGE: ${{ github.sha }}
        run: |
          # Як і з GHCR_TOKEN: контекст secrets в умові кроку недоступний.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN не заданий — фронтенди не котимо"
            exit 0
          fi
          bun scripts/deploy-front.mjs ${{ matrix.app }} --if-changed

  # Реєстр не безрозмірний: у безкоштовному тарифі приватні пакети мають
  # 500 МБ на все (docs/deploy.md §2.3). Шари базового образу між версіями
  # спільні, але старі версії однаково варто прибирати — інакше одного дня
  # пуш просто перестане проходити.
  cleanup:
    needs: deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        svc: [api, ws, checkbox, scheduler, overseer, migrate, caddy]
    steps:
      - name: Лишити п'ять останніх версій ${{ matrix.svc }}
        if: ${{ env.ACT != 'true' }}
        uses: actions/delete-package-versions@v5
        with:
          # Пакети лежать в акаунті користувача, а не в репозиторії, тому
          # потрібні owner і власний токен: GITHUB_TOKEN їх просто не бачить
          # («get versions API failed. Package not found», 23.09.2026).
          # Токену треба право delete:packages.
          owner: ${{ github.repository_owner }}
          token: ${{ secrets.GHCR_TOKEN }}
          package-name: extrovert-${{ matrix.svc }}
          package-type: container
          min-versions-to-keep: 5

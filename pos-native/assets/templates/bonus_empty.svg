<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="470" height="610" viewBox="0 0 470 610" fill="#F2EFE6">
  <defs>
    <radialGradient id="coinGlow" gradientUnits="userSpaceOnUse" cx="235" cy="260.8" r="48"><stop offset="0" stop-color="#FE810B" stop-opacity="0.22"></stop><stop offset="0.72" stop-color="#FE810B" stop-opacity="0"></stop></radialGradient>
    <clipPath id="clipPanel" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="470" height="610" rx="22" ry="22"></rect></clipPath>
  </defs>
  <g clip-path="url(#clipPanel)">
    <rect x="0" y="0" width="470" height="610" fill="#14171B"></rect>
    <text x="22" y="37.2" font-family="Extro700" font-size="19" letter-spacing="0.6">ЗАБЕРИ БОНУСИ</text>
    <text x="448" y="37.2" text-anchor="end" font-family="Extro400" font-size="14" fill="#F2EFE6" fill-opacity="0.5">2 хв на отримання</text>
    <circle cx="235" cy="260.8" r="47.5" fill="#FFFFFF" fill-opacity="0.04" stroke="#FE810B" stroke-opacity="0.28"></circle>
    <circle cx="235" cy="260.8" r="47.5" fill="url(#coinGlow)"></circle>
    <image x="212" y="237.8" width="46" height="46" href="{{ASSETS}}/coin.png" xlink:href="{{ASSETS}}/coin.png"></image>
    <!-- y — базова лінія, не центр: dominant-baseline="central" librsvg не
         рендерить, зсунуто на виміряний (ascent-descent)/2, як і скрізь
         (29.08.2026). -->
    <text x="235" y="345.5" text-anchor="middle" font-family="Extro700" font-size="22">Бонусів поки немає</text>
    <text x="235" y="382.7" text-anchor="middle" font-family="Extro400" font-size="15" fill="#F2EFE6" fill-opacity="0.55">Купуй напій — і тут з'явиться</text>
    <text x="235" y="403.7" text-anchor="middle" font-family="Extro400" font-size="15" fill="#F2EFE6" fill-opacity="0.55">QR-код, щоб забрати монети</text>
    <text x="235" y="424.7" text-anchor="middle" font-family="Extro400" font-size="15" fill="#F2EFE6" fill-opacity="0.55">протягом 2 хвилин.</text>

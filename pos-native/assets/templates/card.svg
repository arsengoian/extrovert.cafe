<!-- dominant-baseline="central" з оригінального макета librsvg не бере до
     уваги (давня, добре відома дірка — рендерить так, ніби завжди
     dominant-baseline="auto"/alphabetic, y лишається базовою лінією, а не
     центром рядка). Виміряно 29.08.2026 (Pango font metrics: (ascent-
     descent)/2 на реальних Extro/Poppins файлах) і перенесено в самі y —
     атрибут прибрано, щоб не брехати про намір коду. -->
<g transform="translate({{TX}} {{TY}})"><g clip-path="url(#clipCard)"><rect x="0" y="0" width="260" height="296.67" fill="#171A1F"></rect><image x="0" y="20" width="260" height="202" preserveAspectRatio="xMidYMid meet" mask="url(#fadeMask)" href="{{IMG}}" xlink:href="{{IMG}}"></image><rect x="0" y="178.67" width="260" height="118" fill="url(#cardFade)"></rect><text x="14" y="239.17" font-family="Extro700" font-size="20">{{NAME}}</text><text x="14" y="273.17" font-family="Extro400" font-size="16" fill="#F2EFE6" fill-opacity="0.62">{{VOL}}</text><rect x="168" y="251.67" width="78" height="32" rx="16" ry="16" fill="url(#pill)"></rect><text x="207" y="274.4" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="17" fill="#FFFFFF">{{PRICE}}</text></g><rect x="0.5" y="0.5" width="259" height="295.67" rx="17.5" ry="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"></rect></g>
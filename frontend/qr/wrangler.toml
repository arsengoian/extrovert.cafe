# qr.extrovert.cafe — переадресація з QR-наклейки на автоматі (docs/urls.md).
#
# Воркер, а не правило переадресації в дашборді: правило живе лише в панелі
# Cloudflare, і куди веде надрукована адреса, з репозиторію не видно. Тут
# ціль лежить у git і змінюється деплоєм, як решта коду.
name = "extrovert-qr"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Домен qr.extrovert.cafe прив'язує terraform (infra/terraform/cloudflare.tf),
# як і домени решти воркерів: wrangler лише заливає код. Рядок нижче — на
# випадок, якщо колись вирішимо віддати домен назад wrangler-у; стоїть до
# [vars] навмисно, інакше розкоментований став би vars.routes.
# routes = [{ pattern = "qr.extrovert.cafe", custom_domain = true }]

[vars]
APP_ORIGIN = "https://extrovert.cafe"

[observability]
enabled = true

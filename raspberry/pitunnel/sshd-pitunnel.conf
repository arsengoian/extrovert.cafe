# /etc/ssh/sshd_config.d/20-pitunnel.conf — приймач тунелів малин
# (infra/pitunnel/setup.sh). Користувач pitunnel уміє одне: відкрити
# зворотний порт на 127.0.0.1 дроплета, який дозволяє його ключ
# (permitlisten в authorized_keys). Ні оболонки, ні сесій, ні прямих тунелів.
Match User pitunnel
    AllowTcpForwarding remote
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PasswordAuthentication no
    ForceCommand /usr/sbin/nologin
    # 4G рве з'єднання мовчки: напівмертва сесія тримала б порт, і малина
    # не змогла б підключитись наново. 3 × 30 с — і сесія закрита.
    ClientAliveInterval 30
    ClientAliveCountMax 3

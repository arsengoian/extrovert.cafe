<!-- Шар цін звичайної картки (card.svg) (28.09.2026): те, що міняється від знижки й нових цін,
     окремо від картинки, назви й об'єму. На Pi 1 усе меню малюється ~22 с,
     і знижка з'являлась на екрані лише з 20-ї секунди свого вікна, а
     повертались повні ціни так само із запізненням. Цей шар малюється за
     частку секунди й лягає поверх меню (render_prices, main.c). Координати
     ті самі, що були в картці, — на екрані нічого не зсунулось. -->

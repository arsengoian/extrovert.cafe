# Drop-in для dhcpcd.service: /etc/systemd/system/dhcpcd.service.d/extrovert-bridge.conf
#
# dhcpcd читає конфіг із /run, який щоразу генерує extrovert-bridge.sh: з
# мостом — адреса на br0, без мосту — копія /etc/dhcpcd.conf. Сам
# /etc/dhcpcd.conf не змінюється (docs/raspberry-pi.md, «Термінал через малину»).
# Рядок ExecStart — той самий, що в /lib/systemd/system/dhcpcd.service на
# Stretch, плюс -f.

[Unit]
Wants=extrovert-bridge.service
After=extrovert-bridge.service

[Service]
ExecStart=
ExecStart=/usr/lib/dhcpcd5/dhcpcd -q -b -f /run/dhcpcd.conf

# Склад стеку на точці. Читає supervisor.sh. Їде всередині релізу, тому
# новий компонент зʼявляється звичайним оновленням — без sudo й без правок
# у /etc/systemd.
#
# формат:  <імʼя>  <exec відносно релізу>  <overlap>  <enabled>  [аргументи]
#
#   overlap=1 — компонент уміє піднятись поруч зі старою копією (кіоск:
#               сусідній dispmanx-шар + свій telemetry-сокет), тож оновлення
#               проходить без чорного екрана. Для всього іншого 0.
#   enabled=0 — лишається в релізі, але не запускається (готуємо заздалегідь).

kiosk     bin/kiosk   1  1
updater   stack/updater.sh    0  1

telemetry stack/telemetry.sh  0  1

# Запис камери на флешку (docs/video.md). Без config/camera.env чекає й
# нічого не пише, тож рядок увімкнений і там, де камери ще немає. Новий
# рядок супервізор підхоплює лише з наступного старту юніта (ребут чи
# systemctl restart extrovert, raspberry-pi.md §2).
recorder  stack/recorder.sh   0  1
# Заливка записаних сегментів у R2 через api (uploader.sh). Без ключа точки
# чекає; сегменти тим часом лежать на флешці.
uploader  stack/uploader.sh   0  1
# Зворотний ssh-тунель до дроплета (tunnel.sh, raspberry-pi.md «Тунель»):
# доступ до малини не лише з Wi-Fi кав'ярні. Ключ генерує сама.
tunnel    stack/tunnel.sh     0  1

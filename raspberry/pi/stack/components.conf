# Склад стеку на точці. Читає supervisor.sh. Їде всередині релізу, тому
# новий компонент зʼявляється звичайним оновленням — без sudo й без правок
# у /etc/systemd.
#
# формат:  <імʼя>  <exec відносно релізу>  <overlap>  <enabled>  [аргументи]
#
#   overlap=1 — компонент уміє піднятись поруч зі старою копією (кіоск:
#               сусідній dispmanx-шар + свій telemetry-сокет), тож оновлення
#               проходить без чорного екрана. Для всього іншого 0.
#   enabled=0 — лишається в релізі, але не запускається (готуємо заздалегідь).

kiosk     bin/kiosk   1  1
updater   stack/updater.sh    0  1

telemetry stack/telemetry.sh  0  1

# Наступні — з docs/video.md, приїдуть своїм часом:
# recorder  stack/recorder.sh   0  0

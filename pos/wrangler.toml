name = "extrovert-pos"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Без цього рядка статика віддається ДО воркера, і /p/<point> до коду не
# доходить взагалі: шар ассетів не знаходить такого файла й робить 307 на «/».
# Кіоск при цьому відкривався, але вже без ідентифікатора точки в шляху, тобто
# POINT завжди був дефолтний — друга точка показувала б ціни першої.
run_worker_first = true
# А без цього рядка воркер робить ASSETS.fetch("/index.html"), і шар ассетів
# ввічливо редіректить /index.html → / (це його дефолтна «краса URL»).
# Назовні це виглядало як 307 з /p/<point> на корінь — тобто рівно та сама
# поломка, тільки на крок пізніше.
html_handling = "none"

[[r2_buckets]]
binding = "PRICES"
bucket_name = "extrovert-pos"

[observability]
enabled = true

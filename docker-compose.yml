# Бекенд самокав'ярень. Фронтенди тут не крутяться — вони на Cloudflare Workers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extrovert}
      POSTGRES_USER: ${POSTGRES_USER:-extrovert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай у .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # 5442, а не 5432: на машині може крутитись інший локальний постгрес.
    # Усередині мережі compose сервіси ходять на 5432, міняється лише хост.
    ports: ["5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-extrovert}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    ports: ["6389:6379"]   # той самий мотив, що й у постгреса вище
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Одноразова робота, не сервіс: накотити схему й вийти.
  migrate:
    build: ./db
    env_file: [.env]
    # Тека міграцій ще й монтується поверх тієї, що в образі: інакше кожен
    # новий файл вимагав би --build, а `compose run migrate up` мовчки
    # застосовував би стару копію. Заодно dbmate кладе schema.sql на хост,
    # де його й комітять.
    volumes: ["./db:/app/db"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-extrovert}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-extrovert}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    command: ["--no-dump-schema", "up"]
    restart: "no"

  api:
    build: { context: ., dockerfile: docker/bun.Dockerfile, args: { SVC: api } }
    env_file: [.env]
    environment: { PORT: 3001 }
    ports: ["3001:3001"]
    depends_on:
      migrate:  { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  ws:
    build: { context: ., dockerfile: docker/bun.Dockerfile, args: { SVC: ws } }
    env_file: [.env]
    environment: { PORT: 3002 }
    ports: ["3002:3002"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  checkbox:
    build: { context: ., dockerfile: docker/bun.Dockerfile, args: { SVC: checkbox } }
    env_file: [.env]
    environment: { PORT: 3003 }
    ports: ["3003:3003"]
    depends_on:
      migrate:  { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  # Локальний S3 замість R2. Сенс не в економії, а в тому, щоб на машині
  # розробника не лежали ключі, якими можна записати в прод: тут інший
  # endpoint, інші ключі й бакети з суфіксом -dev (lib/src/r2.js).
  # Порти нестандартні (9100/9101) — 9000 часто зайнятий іншим стеком.
  minio:
    # Профіль local: на дроплеті `docker compose up -d` цього сервісу навіть
    # не бачить — там справжній R2, і локальний S3 поруч був би зайвим
    # способом переплутати оточення.
    profiles: ["local"]
    # Образ із quay.io: на Docker Hub MinIO більше не публікує. Тег точний,
    # як і всюди в цьому файлі, — «latest» на двох машинах означає різне.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${R2_DEV_ACCESS_KEY_ID:-extrovert-local}
      MINIO_ROOT_PASSWORD: ${R2_DEV_SECRET_ACCESS_KEY:-extrovert-local-secret}
    ports: ["9100:9000", "9101:9101"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Разовий контейнер: створює дев-бакети, щоб заливка не падала на
  # «NoSuchBucket» під час першого ж запуску.
  minio-buckets:
    profiles: ["local"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${R2_DEV_ACCESS_KEY_ID:-extrovert-local} ${R2_DEV_SECRET_ACCESS_KEY:-extrovert-local-secret} &&
      for b in extrovert-pos-dev extrovert-uploads-dev extrovert-evidence-dev extrovert-video-dev; do
        mc mb --ignore-existing local/$$b;
      done &&
      mc anonymous set download local/extrovert-pos-dev
      "
    restart: "no"

  # Фонові роботи за розкладом: публікатор outbox, покази маркету, довідник
  # і трекінг Нової Пошти (docs/services.md §2).
  scheduler:
    build: { context: ., dockerfile: docker/bun.Dockerfile, args: { SVC: scheduler } }
    env_file: [.env]
    depends_on:
      migrate:  { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  overseer:
    build: { context: ., dockerfile: docker/bun.Dockerfile, args: { SVC: overseer } }
    env_file: [.env]
    depends_on:
      migrate:  { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Збір помилок з усіх сервісів. Свій, щоб не платити за Sentry.
  glitchtip:
    image: glitchtip/glitchtip:latest
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-extrovert}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?задай у .env}
      PORT: 8000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    command: ./bin/run-celery-with-beat.sh
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-extrovert}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?задай у .env}
    depends_on: [glitchtip]
    restart: unless-stopped

volumes:
  minio:
  pgdata:
  redisdata:
